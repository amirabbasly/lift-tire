# ═══════════════════════════════════════════════════════════════
#  Lift Tire — لیفت تایر
#  سرویس‌ها: postgres → api → web → nginx
#  اجرا: ./deploy.sh install   |   وضعیت: ./deploy.sh doctor
# ═══════════════════════════════════════════════════════════════
name: lifttire

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifttire_db
    restart: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifttire}
      POSTGRES_USER: ${POSTGRES_USER:-lifttire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifttire_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifttire} -d ${POSTGRES_DB:-lifttire}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lifttire]

  api:
    build:
      context: ./backend
    container_name: lifttire_api
    restart: *default-restart
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifttire}:${POSTGRES_PASSWORD:-lifttire_pass}@postgres:5432/${POSTGRES_DB:-lifttire}
      USE_PGLITE: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lift-tire.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Lift@12345}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    networks: [lifttire]

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://lift-tire.com}
    container_name: lifttire_web
    restart: *default-restart
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://lift-tire.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [lifttire]

  nginx:
    image: nginx:1.27-alpine
    container_name: lifttire_nginx
    restart: *default-restart
    logging: *default-logging
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      # auto: اگر گواهی SSL موجود باشد HTTPS، وگرنه سایت روی HTTP بالا می‌آید
      NGINX_MODE: ${NGINX_MODE:-auto}
    volumes:
      # قالب‌های آمادهٔ nginx (http.conf / https.conf / locations.conf)
      - ./nginx/site:/opt/nginx-sites:ro
      # انتخاب خودکار حالت در زمان استارت کانتینر
      - ./nginx/entrypoint-mode.sh:/docker-entrypoint.d/40-lifttire-mode.sh:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - uploads:/var/www/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [lifttire]

volumes:
  pgdata:
  uploads:

networks:
  lifttire:
    driver: bridge
