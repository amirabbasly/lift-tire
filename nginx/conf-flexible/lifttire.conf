# ═══════════════════════════════════════════════════════════════
#  حالت موقت: Cloudflare با SSL mode = Flexible
#  در این حالت Cloudflare روی پورت ۸۰ به سرور وصل می‌شود و
#  گواهی روی سرور لازم نیست. هیچ ریدایرکت HTTPS روی origin نداریم
#  تا حلقهٔ ریدایرکت پیش نیاید.
#
#  ⚠️ این حالت فقط برای راه‌اندازی سریع/موقت است. حالت امن:
#     نصب Origin Certificate + SSL mode = Full (strict)
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name lift-tire.com;

    client_max_body_size 12m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml font/woff2;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @api_uploads;
    }
    location @api_uploads {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# www → دامنهٔ اصلی (بدون حلقه، چون مقصد از دید مرورگر https است)
server {
    listen 80;
    listen [::]:80;
    server_name www.lift-tire.com;
    return 301 https://lift-tire.com$request_uri;
}
