# ─── قواعد مشترک پروکسی (در هر دو حالت HTTP و HTTPS استفاده می‌شود) ───

client_max_body_size 12m;

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml font/woff2;

# فایل‌های آپلودی کاربران (volume مشترک با api)
# بدون alias/try_files — پروکسی ساده به API (بدون باگ‌های شناخته‌شدهٔ alias)
location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# API
location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

# فایل‌های استاتیک نکست
location /_next/static/ {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /images/ {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
}

# فرانت‌اند
location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
