# ═══════════════════════════════════════════════════════════════
#  Lift Tire — حالت HTTPS (وقتی گواهی معتبر موجود است)
#  پورت ۸۰ فقط برای ACME و ریدایرکت به https است.
# ═══════════════════════════════════════════════════════════════
# http (ACME + redirect)
server {
    listen 80;
    listen [::]:80;
    server_name lift-tire.com www.lift-tire.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # سلامت سرویس
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://lift-tire.com$request_uri;
    }
}

# https — دامنه اصلی
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lift-tire.com;

    ssl_certificate     /etc/letsencrypt/live/lift-tire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lift-tire.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # سلامت سرویس
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /opt/nginx-sites/locations.conf;
}

# www → بدون www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lift-tire.com;

    ssl_certificate     /etc/letsencrypt/live/lift-tire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lift-tire.com/privkey.pem;

    return 301 https://lift-tire.com$request_uri;
}
