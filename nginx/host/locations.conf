# ─── قواعد مشترک پروکسی — حالت PM2 (nginx روی خودِ سرور) ───────
#  در این حالت وب و API با PM2 روی 127.0.0.1 اجرا می‌شوند.

client_max_body_size 12m;

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml font/woff2;

# ── API (Express / PM2) ──────────────────────────────────────
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

# ── آپلودها (همان API سرو می‌کند) ────────────────────────────
location /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# ── فایل‌های استاتیک Next ────────────────────────────────────
location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /images/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
}

# ── فرانت‌اند (Next.js standalone / PM2) ─────────────────────
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
