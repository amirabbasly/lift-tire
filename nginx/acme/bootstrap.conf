# ─── کانفیگ موقت برای گرفتن گواهی SSL (وقتی هنوز گواهی نداریم) ───
# فقط پورت ۸۰ را باز می‌کند و مسیر ACME را سرو می‌کند.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    default_type text/plain;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Lift Tire — SSL bootstrap OK\n";
    }
}
