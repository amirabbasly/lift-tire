# ─────────────── Lift Tire — reverse proxy ───────────────
# http (ACME + redirect)
server {
    listen 80;
    listen [::]:80;
    server_name lifttire.ir www.lifttire.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lifttire.ir$request_uri;
    }
}

# https — دامنه اصلی
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lifttire.ir;

    ssl_certificate     /etc/letsencrypt/live/lifttire.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifttire.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml font/woff2;

    # فایل‌های آپلودی کاربران (از volume مشترک)
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @api_uploads;
    }
    location @api_uploads {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    # API
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # فایل‌های استاتیک نکست
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # فرانت‌اند
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# www → بدون www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lifttire.ir;

    ssl_certificate     /etc/letsencrypt/live/lifttire.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifttire.ir/privkey.pem;

    return 301 https://lifttire.ir$request_uri;
}
